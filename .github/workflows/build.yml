name: Gerar Daggomo VPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Codigo
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Ligar o Motor Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar biblioteca que o NDK 17 precisa
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses6
          sudo ln -s /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          echo "Biblioteca instalada e atalho criado com sucesso!"
          
      - name: Opcao Nuclear - Destruir a pasta v35
        run: |
          find . -name "values-v35" -type d -exec rm -rf {} +
          echo "PASTA DESTRUIDA COM SUCESSO!"
          
      - name: Forjar a SUPER Chave Secreta (Com Chaves Oficiais)
        run: |
          DIR="app/src/main/java/com/psiphon3/psiphonlibrary"
          mkdir -p $DIR
          cat <<EOF > "$DIR/EmbeddedValues.java"
          package com.psiphon3.psiphonlibrary;
          import android.content.Context;
          import net.grandcentrix.tray.AppPreferences;
          import net.grandcentrix.tray.core.ItemNotFoundException;
          import net.grandcentrix.tray.core.SharedPreferencesImport;

          public class EmbeddedValues {
              // 1. ADDITIONAL PARAMETERS (Fix for unmarshaling and required config)
              public static final String ADDITIONAL_PARAMETERS = "uICBULj++X46IEIp ";
              
              public static final String[] EMBEDDED_SERVER_LIST = new String[0];
              
              // 2. URL LISTS (Using the new String[] structure)
              public static final String[] REMOTE_SERVER_LIST_URLS = {
                  "https://s3.amazonaws.com/psiphon/web/mjr4-p23r-puwl/server_list_compressed",
                  "https://www.expertfmghostivy.com/web/mjr4-p23r-puwl/server_list_compressed",
                  "https://www.raceegguxdas.com/web/mjr4-p23r-puwl/server_list_compressed",
                  "https://www.latinofirmddhosts.com/web/mjr4-p23r-puwl/server_list_compressed"
              };
              public static final String[] OBFUSCATED_SERVER_LIST_ROOT_URLS = {
                  "https://s3.amazonaws.com/psiphon/web/mjr4-p23r-puwl/osl",
                  "https://www.expertfmghostivy.com/web/mjr4-p23r-puwl/osl",
                  "https://www.raceegguxdas.com/web/mjr4-p23r-puwl/osl",
                  "https://www.latinofirmddhosts.com/web/mjr4-p23r-puwl/osl"
              };
              public static final String[] UPGRADE_DOWNLOAD_URLS = {
                  "https://s3.amazonaws.com/psiphon/web/mjr4-p23r-puwl/PsiphonAndroid.apk.upgrade",
                  "https://www.expertfmghostivy.com/web/mjr4-p23r-puwl/PsiphonAndroid.apk.upgrade",
                  "https://www.raceegguxdas.com/web/mjr4-p23r-puwl/PsiphonAndroid.apk.upgrade",
                  "https://www.latinofirmddhosts.com/web/mjr4-p23r-puwl/PsiphonAndroid.apk.upgrade"
              };
              public static final String[] FEEDBACK_UPLOAD_URLS = {
                  "https://s3.amazonaws.com/psiupload/",
                  "https://www.nwbugnewslettergateway.com.global.prod.fastly.net/",
                  "https://www.greenlottosafariewest.com.global.prod.fastly.net/",
                  "https://www.celebrityfeedballs.com.global.prod.fastly.net/"
              };

              // 3. PUBLIC KEYS AND CHANNEL ID
              public static final String REMOTE_SERVER_LIST_SIGNATURE_PUBLIC_KEY = "";
              public static final String SERVER_ENTRY_SIGNATURE_PUBLIC_KEY = "sHuUVTWaRyh5pZwy4UguSgkwmBe0EHtJJkoF5WrxmvA=";
              public static final String SERVER_ENTRY_EXCHANGE_OBFUSCATION_KEY = "3b006746f35a4d33a7e53f19e6022e0394c8e718cc932f99";
              public static final String FEEDBACK_ENCRYPTION_PUBLIC_KEY = "";
              public static final String PROPAGATION_CHANNEL_ID = "92AACC5BABE0944C";
              public static final String UPGRADE_SIGNATURE_PUBLIC_KEY = "";

              // 4. CONFIGURATION AND STRINGS
              public static String SPONSOR_ID = "DaggomoVPN";
              public static final String CLIENT_VERSION = "1.0 Daggomo";
              public static String INFO_LINK_URL = "https://daggomo.com/info";
              public static String GET_NEW_VERSION_URL = "https://daggomo.com/download";
              public static String GET_NEW_VERSION_EMAIL = "get@daggomo.com";
              public static String FAQ_URL = "https://daggomo.com/faq";
              public static String DATA_COLLECTION_INFO_URL = "https://daggomo.com/privacidade";
              public static final String FILE_BUG_EMAIL_ADDRESS = "suporte@daggomo.com";
              public static final boolean IGNORE_NON_EMBEDDED_SERVER_ENTRIES = false;
              public static final boolean IS_PLAY_STORE_BUILD = false;
              public static final String[] HOME_TAB_URL_EXCLUSIONS = new String[0];
              public static final boolean CAN_PROMPT_FOR_RATING = false;
              public static final String UPGRADE_URL_STRING = "";
              public static final String[] UPGRADE_URL_STRINGS = new String[0];
              public static final String UPGRADE_VERSION_FILE_URL_STRING = "";
              public static final boolean SUPPORTS_SUBSCRIPTIONS = false;
              public static final boolean EXCLUDE_APPS_BY_DEFAULT = false;
              public static final String[] DATA_TRANSFER_RATE_EXCLUSIONS = new String[0];
              public static final boolean SHOW_NETWORK_ALERTS = false;
              public static final boolean ALWAYS_SHOW_DATA_TRANSFER_RATE = true;
              public static final boolean SUPPORTS_CUSTOM_SERVER_ENTRIES = true;
              public static final boolean SHOW_SPLIT_TUNNEL_REGION_HINT = false;
              public static final boolean ENABLE_BROADCASTS = false;
              public static final String CLIENT_REGION = "";
              public static final String AUTHORIZATION_ID = "";
              public static final boolean EMIT_ANALYTICS = false;
              public static final int FEEDBACK_LIFESPAN_DAYS = 14;
              public static final boolean HAS_TOS_URL = false;
              public static final String TOS_URL = "";
              public static final boolean HAS_PRIVACY_URL = false;
              public static final String PRIVACY_URL = "";
              public static final boolean REQUIRE_INITIAL_AUTHORIZATION = false;
              public static final String INITIAL_AUTHORIZATION_URL = "";
              public static final boolean DISABLE_TIMEOUTS = false;

              public static boolean hasEverBeenSideLoaded(Context context) { return false; }

              private static final String SPONSOR_ID_PREFERENCE = "sponsorIdPreference";
              private static final String INFO_LINK_URL_PREFERENCE = "infoLinkUrlPreference";
              private static final String GET_NEW_VERSION_URL_PREFERENCE = "getNewVersionUrlPreference";
              private static final String GET_NEW_VERSION_EMAIL_PREREFENCE = "getNewVersionEmailPreference";
              private static final String FAQ_URL_PREFERENCE = "faqUrlPreference";
              private static final String DATA_COLLECTION_INFO_URL_PREFERENCE = "dataCollectionInfoUrlPreference";

              public static void initialize(Context context) {
                  AppPreferences mpPreferences = new AppPreferences(context);
                  String prefFileName = context.getPackageName() + "_preferences";

                  mpPreferences.migrate(
                          new SharedPreferencesImport(context, prefFileName, SPONSOR_ID_PREFERENCE, SPONSOR_ID_PREFERENCE),
                          new SharedPreferencesImport(context, prefFileName, INFO_LINK_URL_PREFERENCE, INFO_LINK_URL_PREFERENCE),
                          new SharedPreferencesImport(context, prefFileName, GET_NEW_VERSION_URL_PREFERENCE, GET_NEW_VERSION_URL_PREFERENCE),
                          new SharedPreferencesImport(context, prefFileName, GET_NEW_VERSION_EMAIL_PREREFENCE, GET_NEW_VERSION_EMAIL_PREREFENCE),
                          new SharedPreferencesImport(context, prefFileName, FAQ_URL_PREFERENCE, FAQ_URL_PREFERENCE),
                          new SharedPreferencesImport(context, prefFileName, DATA_COLLECTION_INFO_URL_PREFERENCE, DATA_COLLECTION_INFO_URL_PREFERENCE)
                  );

                  if (!IS_PLAY_STORE_BUILD) {
                      mpPreferences.put(SPONSOR_ID_PREFERENCE, SPONSOR_ID);
                      mpPreferences.put(INFO_LINK_URL_PREFERENCE, INFO_LINK_URL);
                      mpPreferences.put(GET_NEW_VERSION_URL_PREFERENCE, GET_NEW_VERSION_URL);
                      mpPreferences.put(GET_NEW_VERSION_EMAIL_PREREFENCE, GET_NEW_VERSION_EMAIL);
                      mpPreferences.put(FAQ_URL_PREFERENCE, FAQ_URL);
                      mpPreferences.put(DATA_COLLECTION_INFO_URL_PREFERENCE, DATA_COLLECTION_INFO_URL);
                  } else {
                      SPONSOR_ID = mpPreferences.getString(SPONSOR_ID_PREFERENCE, SPONSOR_ID);
                      INFO_LINK_URL = mpPreferences.getString(INFO_LINK_URL_PREFERENCE, INFO_LINK_URL);
                      GET_NEW_VERSION_URL = mpPreferences.getString(GET_NEW_VERSION_URL_PREFERENCE, GET_NEW_VERSION_URL);
                      GET_NEW_VERSION_EMAIL = mpPreferences.getString(GET_NEW_VERSION_EMAIL_PREREFENCE, GET_NEW_VERSION_EMAIL);
                      FAQ_URL = mpPreferences.getString(FAQ_URL_PREFERENCE, FAQ_URL);
                      DATA_COLLECTION_INFO_URL = mpPreferences.getString(DATA_COLLECTION_INFO_URL_PREFERENCE, DATA_COLLECTION_INFO_URL);
                  }
              }
          }
          EOF
          echo "Super Chave Secreta forjada com SUCESSO ABSOLUTO!"
          
      - name: Dar permissao pro Pedreiro
        run: chmod +x gradlew
        
      - name: Construir o APK
        run: ./gradlew assembleDebug
        
      - name: Entregar o APK pra baixar
        uses: actions/upload-artifact@v4
        with:
          name: DaggomoVPN-APK
          path: app/build/outputs/apk/debug/*.apk
